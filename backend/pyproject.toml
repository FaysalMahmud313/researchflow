[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "researchflow-backend"
version = "1.1.0"
description = "ResearchFlow Collaborative Research Management Platform Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pillow>=11.0.0,<14.0.0",
    "argon2-cffi>=23.1.0,<24.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
    "pip-audit>=2.7.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
# Style-only rules are not enforced: long lines, typing.List/Optional spellings, and
# FastAPI's Depends()/File() defaults (B008), which are the framework's own idiom.
ignore = ["S101", "E501", "B008", "UP006", "UP035", "UP042", "UP045"]

[tool.ruff.lint.per-file-ignores]
# Tests use fixed throwaway passwords.
"tests/**" = ["S105", "S106", "S107"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
